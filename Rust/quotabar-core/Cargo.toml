[package]
name = "quotabar-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Performance-critical QuotaBar primitives compiled to a static library and called from Swift over a small C ABI (Claude and Codex usage-line parsers)."

[lib]
name = "quotabar_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde_json = "1"
# SIMD byte search for the shared whole-file reader's line splitting and the per-provider
# marker pre-filters — the innermost loops over multi-GB JSONL corpora. serde_json alone cannot
# find line boundaries before parsing.
memchr = "2"

[profile.release]
lto = true
codegen-units = 1
