[package]
name = "quotabar-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "The macOS static library: the C ABI over quotabar-engine (the cross-platform backend) plus the Claude/Codex usage-line parsers and pricing codec Swift still calls directly."

[lib]
name = "quotabar_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde_json = "1"
quotabar-engine = { path = "../quotabar-engine" }

[profile.release]
lto = true
codegen-units = 1
