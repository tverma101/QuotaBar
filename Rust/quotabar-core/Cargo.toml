[package]
name = "quotabar-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Performance-critical QuotaBar primitives compiled to a static library and called from Swift over a small C ABI."

[lib]
name = "quotabar_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
