[package]
name = "quotabar-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Performance-critical QuotaBar primitives compiled to a static library and called from Swift over a small C ABI (Claude and Codex usage-line parsers)."

[lib]
name = "quotabar_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
memchr = "2.8.3"

[profile.release]
lto = true
codegen-units = 1
