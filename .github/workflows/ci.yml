name: CI

on:
  # The Swift edition ships from `main`. The frozen Tauri edition is preserved on `tauri-legacy`.
  push:
    branches: [main, codex/token-accounting-cpu-benchmark]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Build and Test
    # Builds against the macOS 26 SDK with the package's macOS 15 deployment target (Package.swift
    # .macOS(.v15)), so this compiles the whole codebase — including the `if #available(macOS 26, *)`
    # Liquid Glass branches — for the macOS 15 floor. That is the floor's compile guarantee: a binary
    # built here reports minos 15.0. We do NOT add a macos-15 runner leg — back-deployment compiles
    # against the newest SDK, and a stock macos-15 runner ships Swift 6.1 without the macOS 26 SDK, so
    # it cannot build this package. Runtime verification on Sequoia is a manual smoke pass.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

      # This dedicated public branch runs the deterministic synthetic-ledger benchmark on GitHub's
      # isolated macOS runner. It never copies or uploads a user's local usage ledger.
      # Benchmarks use XCTest only; the full suite above still runs both testing libraries.
      - name: Measure Production Aggregate Reuse
        if: github.ref == 'refs/heads/codex/token-accounting-cpu-benchmark'
        run: QUOTABAR_PRODUCTION_ACCOUNTING_BENCH=1 swift test -c release -j 2 --disable-index-store --disable-swift-testing --filter ProductionTokenAccountingEfficiencyTests

      - name: Measure token accounting CPU
        if: github.ref == 'refs/heads/codex/token-accounting-cpu-benchmark'
        run: script/measure_token_accounting.sh
