name: Windows CI

on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows-ci.yml']
  pull_request:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer:
    name: Test and Build Windows Installer
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: windows
          cache-bin: false

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Test Frontend and Providers
        run: bun run test

      - name: Test Native CLI and Provider Runtime
        run: cargo test --locked --release -p quotabar-core -p quotabar-cli

      - name: Build x64 Installer
        shell: pwsh
        run: |
          $buildArgs = @('--bundles', 'nsis')
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+(?:-beta\.\d+)?$') {
              throw "The Windows installer requires a valid QuotaBar release tag."
            }
            $config = Join-Path $env:RUNNER_TEMP 'quotabar-release.json'
            @{ version = $env:GITHUB_REF_NAME.Substring(1) } |
              ConvertTo-Json -Compress | Set-Content -Encoding Ascii $config
            $buildArgs += @('--config', $config)
          }
          bun run tauri:build @buildArgs -- --locked

      - name: Upload Windows QA Installer
        uses: actions/upload-artifact@v7
        with:
          name: quotabar-windows-x64-qa
          path: windows/target/**/bundle/nsis/*-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
