name: Windows CI

on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows-ci.yml']
  pull_request:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer:
    name: Test and Build Windows Installer
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: windows
          cache-bin: false

      - name: Refuse Private Google Builds
        shell: pwsh
        run: |
          # Public installers must follow Google's Antigravity and Gemini terms (see AGENTS.md).
          if ($env:QUOTABAR_GOOGLE_PRIVATE_ACCESS) {
            throw "QUOTABAR_GOOGLE_PRIVATE_ACCESS is for private owner builds and must not be set in CI."
          }

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Test Frontend and Providers
        run: bun run test

      - name: Test Native CLI and Provider Runtime
        run: cargo test --locked --release -p quotabar-core -p quotabar-cli

      - name: Build x64 Installer
        shell: pwsh
        env:
          # Only tagged release builds sign the installer for the in-app updater (docs/releasing.md).
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          $buildArgs = @('--bundles', 'nsis')
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+(?:-beta\.\d+)?$') {
              throw "The Windows installer requires a valid QuotaBar release tag."
            }
            if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
              throw "Release builds must sign the update. Add the TAURI_SIGNING_PRIVATE_KEY repository secret."
            }
            $config = Join-Path $env:RUNNER_TEMP 'quotabar-release.json'
            @{ version = $env:GITHUB_REF_NAME.Substring(1); bundle = @{ createUpdaterArtifacts = $true } } |
              ConvertTo-Json -Compress -Depth 4 | Set-Content -Encoding Ascii $config
            $buildArgs += @('--config', $config)
          }
          bun run tauri:build @buildArgs -- --locked
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $signatures = @(Get-ChildItem target -Recurse -File -Filter '*-setup.exe.sig' |
              Where-Object { $_.DirectoryName -match '[\\/]bundle[\\/]nsis$' })
            if ($signatures.Count -ne 1) {
              throw "Expected one updater signature for the installer, found $($signatures.Count)."
            }
          }

      - name: Smoke-test Installation and Bundled CLI
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target -Recurse -File -Filter '*-setup.exe' |
            Where-Object { $_.Extension -eq '.exe' -and $_.DirectoryName -match '[\\/]bundle[\\/]nsis$' })
          if ($installers.Count -ne 1) {
            throw "Expected one x64 NSIS installer, found $($installers.Count)."
          }
          ./scripts/smoke-installer.ps1 -Installer $installers[0].FullName

      - name: Upload Windows QA Installer
        uses: actions/upload-artifact@v7
        with:
          name: quotabar-windows-x64-qa
          path: |
            windows/target/**/bundle/nsis/*-setup.exe
            windows/target/**/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
